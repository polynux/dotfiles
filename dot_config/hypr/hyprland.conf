# Hyprland Configuration
# https://wiki.hypr.land/Configuring/

# ==================
# MONITOR CONFIG
# ==================
# Monitors from existing configuration
# monitor=DP-1, 2560x1440@360, 0x0, 1.25, bitdepth, 10
# monitor=DP-2, 1920x1080@120, 2048x0, 1
monitor=DP-1, 2560x1440@360, 0x0, 1, bitdepth, 10
monitor=DP-2, 1920x1080@120, 2560x0, 1

monitor = , preferred,auto,auto

# env = XDG_CURRENT_DESKTOP, KDE
env = QT_QPA_PLATFORMTHEME, qt6ct

# ==================
# STARTUP APPS
# ==================
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user start hyprland-session.target
exec-once = qs -c noctalia-shell &

exec-once = hyprpm reload -n
exec-once = hypridle
# exec-once = nm-applet &
# exec-once = waybar &
exec-once = hyprpaper &
exec-once = variety &
exec-once = kdeconnectd &
# exec-once = swaync &
exec-once = blueman-applet &
exec-once = trayscale --hide-window &
exec-once = vesktop &
exec-once = steam -silent &
exec-once = tidal-hifi &
exec-once = syncthingtray-qt6 &
exec-once = systemctl --user start hyprpolkitagent
# exec-once = copyq --start-server
exec-once = flameshot &
exec-once = handy --start-hidden &
# exec-once = elephant &

$terminal = alacritty
$fileManager = nautilus
$menu = walker
$browser = zen-browser

# ==================
# INPUT CONFIG
# ==================
input {
    kb_layout = us
    numlock_by_default = true
    kb_options = compose:ralt
}

plugin {
    split-monitor-workspaces {
        count = 5
        keep_focused = 0
        enable_notifications = 0
        enable_persistent_workspaces = 1
        monitor_priority = DP-1
    }
}


# ==================
# GENERAL LAYOUT
# ==================
general {
    gaps_in = 5
    gaps_out = 5
    border_size = 2
    exec-once = hyprpm reload -n

    # layout = dwindle
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = master
}

# ==================
# DECORATION
# ==================
decoration {
    rounding = 12

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 30
        render_power = 5
        offset = 0 5
        color = rgba(00000070)
    }
}

# ==================
# ANIMATIONS
# ==================
animations {
    enabled = true

    animation = windowsIn, 1, 3, default
    animation = windowsOut, 1, 3, default
    animation = workspaces, 1, 5, default
    animation = windowsMove, 1, 4, default
    animation = fade, 1, 3, default
    animation = border, 1, 3, default
}

# ==================
# LAYOUTS
# ==================
dwindle {
    preserve_split = true
}

master {
    new_status = master
    mfact = 0.70
}

# ==================
# MISC
# ==================
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# ==================
# WINDOW RULES
# ==================
windowrule = tile on, match:class ^(org\.wezfurlong\.wezterm)$

windowrule = rounding 12, match:class ^(org\.gnome\.)

windowrule = tile on, match:class ^(gnome-control-center)$
windowrule = tile on, match:class ^(pavucontrol)$
windowrule = tile on, match:class ^(nm-connection-editor)$

windowrule = float on, match:class ^(gnome-calculator)$
windowrule = float on, match:class ^(galculator)$
windowrule = float on, match:class ^(blueman-manager)$
# windowrule = float on, match:class ^(org\.gnome\.Nautilus)$
windowrule = float on, match:class ^(xdg-desktop-portal)$

windowrule = no_initial_focus on, match:class ^(steam)$, match:title ^(notificationtoasts)
windowrule = pin on, match:class ^(steam)$, match:title ^(notificationtoasts)

windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = float on, match:class ^(zoom)$

windowrule = float on, match:class ^(it.mijorus.smile)$, match:title ^(Smile)$
windowrule = float on, match:title ^(CopyQ)$

# windowrule = float on, match:title ^(SOUND VOLTEX EXCEED GEAR - Main Screen)$
# windowrule = stay_focused on, match:title ^(SOUND VOLTEX EXCEED GEAR - Main Screen)$

# windowrule = stay_focused on, match:class ^(osu!)$
# windowrule = fullscreen on, match:class ^(osu!)$

# DMS windows floating by default
# ! Hyprland doesn't size these windows correctly so disabling by default here
# windowrule = float on, match:class ^(org.quickshell)$

windowrule = workspace 6, match:class ^(vesktop)$
windowrule = workspace 7, match:class ^(tidal-hifi)$

layerrule = no_anim on, match:namespace ^(quickshell)$
layerrule = no_anim on, match:namespace ^dms:.*

windowrule = float on, match:class ^(flameshot)$
windowrule = no_anim on, match:class ^(flameshot)$
windowrule = pin on, match:class ^(flameshot)$
windowrule = suppress_event maximize, match:class ^(flameshot)$

windowrule = idle_inhibit fullscreen, match:class .*

###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
$altMod = ALT   # Sets "Alt" key as alt modifier

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod&Shift, Q, exit,
# bind = $mainMod, X, exec, wlogout
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, T, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, B, exec, $browser

# bind = $mainMod, semicolon, exec, smile
# bind = $mainMod, V, exec, copyq menu
bind = $mainMod SHIFT, period, exec, pkill -USR2 -x handy

# Region screenshot across all monitors -> save to ~/Pictures/Screenshots and copy to clipboard
bind = , Print, exec, hyprshot -m region -z -o $HOME/Pictures/Screenshots
# Opens flameshot's interactive editor on the monitor under the cursor (works on any screen)
bind = SHIFT, Print, exec, flameshot screen -e
# Captures all monitors at once and copies the combined image to the clipboard
bind = CTRL, Print, exec, flameshot full -c

# Laptop multimedia keys for volume and LCD brightness
