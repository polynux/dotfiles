general {
    lock_cmd = noctalia msg session lock           # single locker: noctalia (was hyprlock -> double-lock vs noctalia)
    before_sleep_cmd = loginctl lock-session    # lock before suspend (routes to lock_cmd above)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'  # screen back on after wake (Lua dispatcher syntax, Hyprland >= 0.55)
}

