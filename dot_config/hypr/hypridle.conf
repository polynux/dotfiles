general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid duplicate lock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # screen back on after wake
}

listener {
    timeout = 900                                # 15 minutes
    on-timeout = hyprctl dispatch dpms off       # screen off
    on-resume = hyprctl dispatch dpms on         # screen back on
}

